name: pill_check
description: "약 먹을 시간을 알려주고 복용 기록을 남기는 복약 알림 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Flutter 3.47부터 package:flutter/material.dart 대신 material_ui 패키지 사용
  material_ui: ^1.11.0
  cupertino_icons: ^1.0.8

  # 상태 관리
  flutter_riverpod: ^3.5.0

  # 로컬 DB (원본 hive는 2022년 이후 유지보수 중단 → 커뮤니티판 hive_ce)
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0

  # 알림
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.0
  flutter_timezone: ^5.1.1

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
